      - "check someone's payslip"
      - "show me an employee's payslip"
      - "show an employee's salary"
      - "look up an employee's payslip"
      - "what is an employee's net pay"
      - "how much did an employee get paid"
      - "check payslip for an employee"
      - "pull up an employee's payslip"
      - "show me someone's salary"
      - "check her payslip"
      - "check his payslip"
      - "look up someone's pay"
      - "show me someone's payslip"

  check_pending_payroll_cycles:
    # Requires payroll.view as this app's own coarse-grained voice gate —
    # dispatches through the existing AttendancePendingCyclesView
    # (payroll/views/attendance_approval.py), whose own internal check
    # (_can_view_approvals: can_manage_team OR payroll.edit) is the real,
    # finer-grained gate; a caller who clears payroll.view here but not that
    # inner check still gets that view's own 403, same as
    # check_employee_payslip's two-layer shape above.
    required_permission: payroll.view
    conversational: false
    phrases:
      - "check pending payroll cycles"
      - "show pending payroll cycles"
      - "what payroll cycles are pending"
      - "which payroll cycles need my approval"
      - "show cycles awaiting approval"
      - "check payroll cycles awaiting approval"
      - "any payroll cycles pending"
