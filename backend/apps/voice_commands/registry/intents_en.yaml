      - "raise an attendance correction request"
      - "my attendance record is incorrect"
      - "help me correct my attendance"
      - "i missed a punch can you fix it"
      - "i need to correct my punch time"
      # Added to close a coverage gap: none of the phrases above use a "raise
      # a query/concern" framing, so that phrasing was drifting to
      # raise_payslip_query's near-identical "raise a query about my
      # payslip" instead (69.84 vs the best this intent's OLD phrase list
      # could offer, 56.72) — confirmed via direct rapidfuzz scoring, not a
      # matcher bug. See test_matcher.py's collision tests for this pair.
      - "raise a query about my attendance"
      - "raise a concern about my attendance"
      - "raise an issue with my attendance"
      - "raise a query regarding my attendance"
      - "i have a query about my attendance"
      - "i have an issue with my attendance"
      - "correctmyattendance"
      - "fixmyattendance"
      - "fixmypunch"
      - "requestattendancecorrection"
      # Concatenated/no-space renderings — same class as the fixes above.
      # "fixmypunch" in particular scored only 66.67 against this intent's
      # own "fix my attendance"/"correct my punch" and lost to clock_in's
      # short "punch in" instead. "requestattendancecorrection" already
      # landed on this intent as the closest candidate (71.43) even before
      # this fix, just short of DEFAULT_CONFIDENCE_THRESHOLD (80) — anchored
      # here so it clears it outright instead of needing a "did you mean".

  greeting:
    # No domain codename required — matches VoiceParseView itself, which is
    # IsAuthenticated only (voice_commands/views.py:41). Single-turn: unlike
    # apply_leave/request_attendance_correction, there's nothing to slot-fill,
    # so this never sets conversational: true.
    #
    # Distinct from VoiceConversationPanel's static "Hi, how can I help you?"
    # placeholder (frontend/components/VoiceConversationPanel.tsx's
    # GREETING_MESSAGE) — that text is shown before any transcript exists and
    # never reaches this registry or /api/voice/parse/ at all. This intent
    # only fires once a real transcript ("hi", "good morning", ...) has been
    # spoken or typed and fuzzy-matched here — see executor_greeting.py for
    # the personalized, time-of-day-aware response it produces.
    required_permission: null
    conversational: false
    phrases:
