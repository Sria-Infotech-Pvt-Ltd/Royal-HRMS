      - "what's pending in payroll"

  check_payroll_cost_summary:
    # Requires payroll.view — the same codename BranchPayrollStatusView
    # itself checks (payroll/views/cycles.py) for a read-only, company/
    # branch-wide payroll view. Company/branch-wide aggregate figures, not a
    # single employee's own payslip — see executor_payroll_analytics.py for
    # why this is read aloud in full, unlike check_my_payslip/
    # check_employee_payslip's redacted speech_message.
    required_permission: payroll.view
    conversational: false
    phrases:
      - "what's our payroll cost"
      - "what is our payroll cost"
      - "check payroll cost summary"
      - "show payroll cost summary"
