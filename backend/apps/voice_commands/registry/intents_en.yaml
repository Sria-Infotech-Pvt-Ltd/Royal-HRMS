      # "balance leave") before scoring, which actively hurts a concatenated
      # transcript that preserves natural spoken word order ("leavebalance").
      # "checkmyleavebalance"/"checkleavebalance"/"leavebalance" scored only
      # 58-67 against this intent's own "leave balance"/"check my leave
      # balance" and lost to check_my_payslip's "check my salary" or
      # check_leave_status's "check my leave status" instead. Anchored here
      # as exact concatenations (each scores 100 against itself) rather than
      # relying on the spaced phrase to double as a fuzzy anchor for its own
      # unspaced form — it can't. Deliberately NOT bare "checkmyleave"/
      # "checkleave" (no "balance"/"status" suffix) — that's genuinely
