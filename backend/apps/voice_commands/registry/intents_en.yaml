  check_employee_payslip:
    # Requires payroll.view — the codename PayslipDetailView.get() checks
    # for viewing anyone OTHER than yourself (payroll/views/payslips.py:61);
    # payroll.view_own (the codename above) does not satisfy this gate.
    # Identify-then-respond, not identify-then-confirm: viewing isn't a
    # mutating action, so conversation_payroll.py never asks for a yes/no —
    # a single employee match is already the terminal response.
    #
    # "check payslip" / "check payslip for" / "check employee payslip" are
    # deliberately registered as their own short, literal phrases — not just
    # the fuller natural-language ones below — because payslip_extractor.py
    # strips the employee-name span before matching (same reason approve_leave
    # registers bare "approve leave for"/"approve leave request" alongside its
    # fuller phrases). "check sarah's payslip" strips down to "check payslip";
    # without a phrase that short registered here, it would fuzzy-match
    # check_my_payslip's "check my payslip" instead (one word closer) once the
    # name is gone.
    required_permission: payroll.view
    conversational: true
    phrases:
      - "check payslip"
      - "check payslip for"
      - "check employee payslip"
      - "show payslip"
      - "show payslip for"
