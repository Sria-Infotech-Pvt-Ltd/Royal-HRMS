# `conversational: true` marks an intent as multi-turn — voice_commands/conversation.py
# may need several exchanges (slot-filling questions, disambiguation, etc.)
# before the intent is actually carried out, rather than dispatching
# immediately from the first utterance. /api/voice/parse/ echoes this back on
# every response as the "conversational" field so the frontend doesn't need
# its own per-intent list of "which commands might need follow-up turns" —
# it reads it straight off the response instead. It's a property of the
# INTENT, not of any one exchange: even a single apply_leave utterance that
# happens to include every slot ("apply for sick leave from july 22 to july
# 24 because i am unwell") still reports conversational: true on its
# (immediate) response — see executor.py/conversation.py's handling of
# "awaiting_input" for the per-turn part of that signal.
#
# apply_leave is the only conversational intent today. Any future intent
# that can need a follow-up question — e.g. a Round 2 approve/reject intent
# that must disambiguate which of several pending requests the caller means
# — should set conversational: true here too.
intents:
  clock_in:
    # No domain codename required — matches AttendancePunchView, which is
    # gated by IsAuthenticated only (backend/apps/attendance/views/my_attendance.py:102).
    required_permission: null
    conversational: false
    phrases:
      - "mark my attendance"
      - "clock in"
      - "clock me in"
      - "punch in"
      - "i'm here"
      - "i've arrived"
      - "i just got in"
      - "i'm at work"
      - "start my shift"
      - "starting my shift"
      - "get me clocked in"
      - "i showed up"
      - "mark me present"
      - "i'm at the office now"
      - "i need to clock in"
      - "i need to clockin"
      # Added to fix a phrase-collision regression: neither phrase above uses
      # an "i need to ___" request framing, so that framing — including the
      # concatenated typo variant "clockin" (no space) — was drifting to
      # request_attendance_correction's near-identical "i need to fix my
      # punch" / "i need to correct my punch time" instead (60.87 vs this
      # intent's OLD best of 57.14 for "clock me in"). Confirmed via direct
      # rapidfuzz scoring, not a matcher bug — same shape as the
      # raise_payslip_query collision fixed below. See test_matcher.py's
      # collision tests for this pair.
      #
      # Deliberately NOT "i need to clock myself in" — token_sort_ratio is a
      # character ratio over alphabetically-sorted tokens, not a directional
      # comparison, so that phrase scored 88.00 against "i need to clockout
      # myself" (a clock_OUT transcript) vs only 86.27 for clock_out's own
      # "i need to clock myself out" — it would have silently stolen
      # clock_out's traffic. The shorter "clockin"/"clockout" forms below
      # separate cleanly instead (each ~10+ points ahead on its own target).
      - "toclockin"
      - "toclockin myself"
      - "i want toclockin"
      - "i wanted toclockin"
      - "i need toclockin"
      # Second occurrence of the same collision class, one concatenation
      # deeper: real logs (2026-08-04) showed "i wanted toclockin myself" —
      # here the STT/typo dropped the space between "to" and "clockin" too,
      # not just inside "clock in" — scoring only 52.83 against this
      # intent's then-best "i need to clockin" (52.38) and losing outright to
      # raise_payslip_query's "i want to dispute my payslip" (also 52.83, a
      # coincidental tie broken in the wrong direction by iteration order).
      # Both scores sat below CLARIFICATION_CONFIDENCE_THRESHOLD (60), so
      # this actually surfaced as a silent generic no-match, not a wrong
      # "did you mean" — see matcher.py's threshold comment. Confirmed via
      # direct rapidfuzz scoring, not a matcher bug. Anchored directly here
      # rather than enumerating every possible verb before "toclockin"
      # ("want"/"wanted"/"need"/"gotta"/...) — the short bare "toclockin" /
      # "toclockin myself" anchors above already generalize to prefixes not
      # explicitly listed, same reasoning as the "clockin"-alone case.

  clock_out:
    # Same as clock_in — AttendancePunchView has no per-punch-type permission check.
    required_permission: null
    conversational: false
    phrases:
