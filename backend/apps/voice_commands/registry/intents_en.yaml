  request_attendance_correction:
    # No domain codename required — matches AttendanceCorrectionView.post()
    # (attendance/views/my_attendance.py:252-265), which is IsAuthenticated-only.
    # Now conversational: true — slot-filling infrastructure (date, punch_type,
    # correct_in_time/correct_out_time depending on punch_type, reason) lives
    # in correction_slot_extractor.py / conversation_attendance_correction.py,
    # mirroring apply_leave's turn-taking shape.
    required_permission: null
    conversational: true
    phrases:
      - "request attendance correction"
      - "correct my attendance"
      - "fix my attendance"
      - "submit an attendance correction"
      - "my attendance is wrong"
      - "correct my punch"
      - "file an attendance correction"
      - "there's a mistake in my attendance"
      - "my punch time is wrong"
