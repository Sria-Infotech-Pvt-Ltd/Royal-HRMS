      - "signing off for the day"
      - "i need to clock out"
      - "i need to clockout"
      # Same collision as clock_in above, symmetric case: "i need to clockout
      # myself" was scoring higher (60.71) against request_attendance_correction's
      # "i need to correct my punch time" than against this intent's OLD best
      # of 54.05 for "clock me out". See clock_in's comment above for why
      # "clock myself out" was deliberately left out (it collided with
      # clock_in's own "clock myself in" phrase — direction words alone
      # aren't enough signal for a character-based ratio scorer).
      - "toclockout"
      - "toclockout myself"
      - "i want toclockout"
      - "i wanted toclockout"
      - "i need toclockout"
      # Symmetric case of clock_in's "toclockin" fix above — see that
      # intent's comment for the real log entry this closes.

